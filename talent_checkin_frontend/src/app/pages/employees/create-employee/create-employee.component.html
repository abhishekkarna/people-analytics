<h1 mat-dialog-title>Add Employee</h1>
<form [formGroup]="addEmployeeForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Name</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput formControlName="name" />
        </mat-form-field>

        <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Job Profile</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <mat-select formControlName="job_profile_id">
                @for (jobProfile of (data?.job_profiles$ | async); track jobProfile) {
                <mat-option [value]="jobProfile?.id">{{jobProfile?.name}}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        @if (data.userInfo.role === "superadmin") {
        <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Select Manager</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <mat-select formControlName="manager_id">
                <mat-option value=null>None</mat-option>
                @for (employee of (data?.employees$ | async); track employee) {
                <mat-option [value]="employee['Employee.employee_id']">{{employee.name}}</mat-option>
                }
            </mat-select>
        </mat-form-field>
        }

        <mat-checkbox formControlName="is_login_allowed">Is Login Allowed ?</mat-checkbox>


        <!-- <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Strengths</mat-label>
        <mat-form-field appearance="outline" class="w-100" color="primary">
            <input matInput formControlName="strengths" />
        </mat-form-field> -->

    </div>

    <mat-dialog-actions>
        <button mat-button (click)="onClose()">Cancel</button>
        <button mat-button type="submit" [disabled]="!addEmployeeForm.valid">Submit</button>
    </mat-dialog-actions>
</form>
